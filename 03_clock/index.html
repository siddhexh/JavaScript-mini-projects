<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Your Local Time</title>
</head>

<body>

    <nav>
        <a href="/">
            <button>Home</button>
        </a>
    </nav>

    <main class="center">

        <div id="banner">
            <span></span>
        </div>

        <div id="date"></div>

        <div id="clock">
            <span id="time"></span>
            <span id="period"></span>
        </div>
        <div id="toggle">
            <span class="toggle-label">24H</span>

            <label class="switch">
                <input type="checkbox" id="timeFormat">
                <span class="slider"></span>
            </label>

            <span class="toggle-label">12H</span>
        </div>

    </main>

    <script src="back.js"></script>

</body>
</html>
