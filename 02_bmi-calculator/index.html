<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <title>BMI Calculator</title>
  </head>
  <body>
    <nav>
      <a href="/" aria-current="page">Home</a>
    </nav>
    <div class="container">
      <h1>BMI Calculator</h1>
      <form>
        <p><label>Height (cms)  : </label><input type="text" id="height" placeholder="Enter your height..."/></p>
        <p><label>Weight (kgs)  : </label><input type="text" id="weight" placeholder="Enter your weight..."/></p>
        <button>Calculate</button>
        <div id="results"></div>
        <div id="range"></div>
        <div id="weight-guide">
          <h3>BMI Weight Guide</h3>
          <p class="guide">Under Weight = Less than 18.6</p>
          <p class="guide">Normal Range = 18.6 and 24.9</p>
          <p class="guide">Overweight = Greater than 24.9</p>
        </div>
      </form>
    </div>
  </body>
  <script src="back.js"></script>
</html>
